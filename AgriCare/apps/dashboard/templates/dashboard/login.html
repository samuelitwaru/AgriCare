<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriCare Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
</head>
<body>
<main class="container" style="max-width: 420px; margin-top: 10vh;">
    <article>
        <hgroup>
            <h2>AgriCare Dashboard</h2>
            <h3>Staff &amp; extension agent login</h3>
        </hgroup>
        {% if form.errors %}
            <p style="color: #c0392b;">Invalid username or password.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit">Log in</button>
        </form>
    </article>
</main>
</body>
</html>
